name: DriftCore - physics tests

on:
  push:
    branches:
      - claude/drift-simulator-map-gen-k0sgp9
    paths:
      - "unreal/DriftCore/**"
      - ".github/workflows/drift-core.yml"
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows/MSVC is what Unreal compiles DriftCore with.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: unreal/DriftCore
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
