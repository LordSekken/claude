name: Drift Lab - test & Windows build

on:
  push:
    branches:
      - claude/drift-simulator-map-gen-k0sgp9
    paths:
      - "drift-sim/**"
      - ".github/workflows/drift-lab.yml"
  workflow_dispatch:

env:
  GODOT_VERSION: 4.4.1

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: drift-sim
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot + export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot + export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -sSL -o templates.tpz https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Import project
        run: ~/godot/godot --headless --path . --import

      - name: Run tests
        run: ~/godot/godot --headless --path . -s tests/run_tests.gd

      - name: Export Windows build
        run: |
          mkdir -p build/windows
          ~/godot/godot --headless --path . --export-release "Windows Desktop" build/windows/DriftLab.exe
          cp README.md build/windows/README.md
          ls -la build/windows

      - name: Build force-feedback helper (ffb_helper.exe + SDL3.dll)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q gcc-mingw-w64-x86-64
          curl -sSL -o /tmp/sdl3.tgz https://github.com/libsdl-org/SDL/releases/download/release-3.2.8/SDL3-devel-3.2.8-mingw.tar.gz
          tar xzf /tmp/sdl3.tgz -C /tmp
          SDL3_DIR=/tmp/SDL3-3.2.8/x86_64-w64-mingw32 native/ffb/build.sh build/windows
          cp "native/Drift Lab VR.bat" build/windows/
          ls -la build/windows

      - name: Export built-in tracks for Assetto Corsa
        run: ~/godot/godot --headless --path . -s tools/export_ac_tracks.gd -- "$PWD/build/ac_tracks"

      - name: Upload Assetto Corsa tracks
        uses: actions/upload-artifact@v4
        with:
          name: DriftLab-AC-tracks
          path: drift-sim/build/ac_tracks/
          if-no-files-found: error

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: DriftLab-windows
          path: drift-sim/build/windows/
          if-no-files-found: error
