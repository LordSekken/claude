[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=DriftGame

[/Script/UnrealEd.ProjectPackagingSettings]
+DirectoriesToAlwaysStageAsNonUFS=(Path="DriftData")

; Steering wheel (read through Binaries/Win64/ffb_helper.exe). Defaults: Logitech G920.
; In game the HUD's top line shows the wheel angle and any held button numbers.
[DriftWheel]
SteerAxis=0
ThrottleAxis=1
BrakeAxis=2
ClutchAxis=3
RotationDeg=900
PedalsInverted=True
ShiftUpButton=4
ShiftDownButton=5
HandbrakeButton=0
CameraButton=3
ResetButton=2
; Driving Force Shifter (Xbox G920): R = 11, gears 1-6 = 12-17 (-1 = no shifter)
ReverseButton=11
FirstGearButton=12
FfbGain=1.0
; Effects on top of the steering torque (0 = off), like AC's road / kerb / slip FFB settings
FfbRoad=0.5
FfbKerb=0.3
FfbSlip=0.15
; True if the T test pulls right first
FfbInvert=False
; Log forces and wheel angle 10x/s to %TEMP%\DriftLab_ffb.log (for tuning)
Trace=True

; Record telemetry (same CSV layout as the AC recorder) to Documents\DriftLab	elemetry
; Cockpit/hood field of view in vertical degrees, same as Assetto Corsa (owner uses 54)
[DriftCamera]
CockpitVFov=54
HoodVFov=54

[DriftTelemetry]
Record=True

[DriftPhysics]
; Chrono (Project Chrono multibody car, needs Binaries/Win64/DriftChrono.dll and
; Content/DriftData/ChronoCars/<car>/) or DriftCore. F6 switches while driving.
Backend=Chrono

[DriftChrono]
; Force feedback: Kingpin = the steering-column torque from the front tyres' forces about each
; kingpin axis (caster trail, KPI, scrub, aligning moment), FfbSteerTorque N m = full force;
; AcCurve = AC's measured force vs front slip; Rack = Chrono's rack load (FfbRackForce N).
FfbSource=Kingpin
FfbSteerTorque=50
FfbRackForce=8000
