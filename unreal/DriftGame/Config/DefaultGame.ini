[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=DriftGame

[/Script/UnrealEd.ProjectPackagingSettings]
+DirectoriesToAlwaysStageAsNonUFS=(Path="DriftData")

; Steering wheel (read through Binaries/Win64/ffb_helper.exe). Defaults: Logitech G920.
; In game the HUD's top line shows the wheel angle and any held button numbers.
[DriftWheel]
SteerAxis=0
ThrottleAxis=1
BrakeAxis=2
ClutchAxis=3
RotationDeg=900
PedalsInverted=True
ShiftUpButton=4
ShiftDownButton=5
HandbrakeButton=0
CameraButton=3
ResetButton=2
; Driving Force Shifter: gears 1-6 then R on consecutive buttons (-1 = no shifter)
FirstGearButton=11
FfbGain=1.0
; True if the T test pulls right first
FfbInvert=False
